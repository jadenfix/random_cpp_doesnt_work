name: Backtester
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  csv-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --parallel 2
      - name: Verify CSV schemas and executable replay
        run: ctest --test-dir build --output-on-failure
